<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Notre Dame of Marbel University</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ndmu-theme.css') }}">
</head>
<body>
    <main class="auth-container">
        <section class="auth-card">
            <div class="login-brand"><div class="login-brand-mark">NDMU</div><div><strong>Notre Dame of Marbel University</strong><span>Socio Attendance System</span></div></div>
            <h1>Welcome Back</h1>
            <p>Sign in to continue to the Socio Attendance System.</p>
            {% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
            <form method="post">
                <label for="username">Username</label>
                <input id="username" name="username" type="text" required autocomplete="username">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" required autocomplete="current-password">
                <button type="submit">Sign In</button>
            </form>
        </section>
    </main>
</body>
</html>
